<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#072652">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Amana – Tableau de bord</title>
<style>
:root{color-scheme:light;--bg:#f1f4f9;--card:#fff;--tx:#0b2147;--mut:#586a88;--bd:#d6deea;--soft:#eaf0f9;--pri:#072652;--acc:#ff7d01}
[data-theme=dark]{color-scheme:dark;--bg:#041532;--card:#0a2250;--tx:#ecf1fb;--mut:#9fb2d3;--bd:#1f3b70;--soft:#102b5d;--pri:#17397a}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:var(--bg);color:var(--tx);padding:16px}
.top,main{max-width:900px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--tx);text-decoration:none}.brand img{width:36px;height:36px;border-radius:9px}
.btn{border-radius:6px;padding:8px 12px;font-weight:700;font-size:.82rem;text-decoration:none;background:var(--soft);color:var(--tx);border:1px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.filt{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
label{display:block;font-size:.72rem;font-weight:600;color:var(--mut);margin-bottom:3px}
select{width:100%;padding:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi small{display:block;color:var(--mut);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.kpi b{font-size:1.3rem;display:block;margin-top:4px}.kpi span{font-size:.75rem;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-bottom:14px}
h2{font-size:.95rem;margin-bottom:10px;border-left:4px solid var(--acc);padding-left:8px}
.empty{color:var(--mut);font-size:.85rem;padding:18px 0;text-align:center}
.pie{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.donut{width:140px;height:140px;flex:none}
.leg{flex:1;min-width:130px;font-size:.78rem}.leg div{display:flex;align-items:center;gap:6px;padding:2px 0}.leg i{width:10px;height:10px;border-radius:2px;flex:none}.leg em{margin-left:auto;font-style:normal;color:var(--mut);white-space:nowrap}
.ctr{fill:var(--tx);font-size:11px;font-weight:700;text-anchor:middle}.ctr2{fill:var(--mut);font-size:8px;text-anchor:middle}
svg.bars{width:100%;height:auto}.ax{fill:var(--mut);font-size:8px}.gl{stroke:var(--bd);stroke-width:.5}
.hb{display:grid;grid-template-columns:minmax(70px,1fr) 2fr auto;gap:8px;align-items:center;font-size:.78rem;padding:4px 0}
.hb div.t{background:var(--soft);border-radius:4px;height:10px}.hb div.t i{display:block;height:100%;border-radius:4px;background:var(--acc)}.hb span:last-child{color:var(--mut);white-space:nowrap}
.perf .row{display:grid;grid-template-columns:1.4fr 1fr .6fr 1fr .6fr .6fr;gap:6px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.78rem;align-items:center}
.perf .row.h{font-size:.68rem;color:var(--mut);font-weight:700;text-transform:uppercase}.perf .row b{font-size:.85rem}
.warn{color:#d9480f;font-weight:700}.note{font-size:.75rem;color:var(--mut);margin-top:10px;line-height:1.5}
@media(max-width:520px){.perf .row{grid-template-columns:1.3fr 1fr .5fr .9fr .5fr .5fr;font-size:.7rem}}
</style>
<script>try{var _t=JSON.parse(localStorage.getItem('theme'));document.documentElement.dataset.theme=_t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
</head>
<body>
<div class="top"><a class="brand" href="./"><img src="icon-192.png" alt="">Amana</a><a class="btn" href="espace.html">← Espace entreprise</a></div>
<main>
  <div class="card filt">
    <div><label>Période</label><select id="per"><option value="7">7 derniers jours</option><option value="30" selected>30 derniers jours</option><option value="90">90 derniers jours</option><option value="month">Ce mois-ci</option><option value="year">Cette année</option></select></div>
    <div><label>Boutique</label><select id="shp"><option value="">Toutes</option></select></div>
    <div><label>Employé</label><select id="usr"><option value="">Tous</option></select></div>
  </div>
  <div id="out"><p class="empty">Chargement…</p></div>
</main>
<script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const h=(t,p={},...k)=>{const e=Object.assign(document.createElement(t),p);k.flat().forEach(x=>e.append(x));return e};
const s=(t,p={},...k)=>{const e=document.createElementNS(NS,t);for(const[a,v]of Object.entries(p))e.setAttribute(a,v);k.flat().forEach(x=>e.append(x));return e};
const tok=JSON.parse(localStorage.getItem('amana_tok')||'null');if(!tok)location.href='espace.html';
const fmt=n=>new Intl.NumberFormat('fr-FR').format(Math.round(n||0))+' FCFA',nb=n=>new Intl.NumberFormat('fr-FR').format(n||0);
const cf=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' M':n>=1e3?Math.round(n/1e3)+' k':String(Math.round(n));
const COL=['#ff7d01','#3f78d8','#2e9d5b','#9b59b6','#17a2b8','#d64545','#e0b400','#7f8c8d'];
const ML={mtn:'MTN MoMo',om:'Orange Money',cash:'Espèces',bank:'Virement',card:'Carte'},SL={valid:'Valides',flagged:'Signalés',void:'Annulés'};
async function api(p){const r=await fetch('/api/v1/'+p,{headers:{authorization:'Bearer '+tok}});const d=await r.json().catch(()=>({}));if(!r.ok)throw d;return d}
const empty=()=>h('p',{className:'empty',textContent:'Aucune donnée sur la période.'});

/* ---- Graphique en secteurs (anneau) ---- */
function donut(data,total,unit){
  const tot=data.reduce((a,d)=>a+d.value,0);if(!tot)return empty();
  const R=62,r=38,cx=70,cy=70,svg=s('svg',{viewBox:'0 0 140 140',class:'donut'}),leg=h('div',{className:'leg'});let a0=-Math.PI/2;
  data.forEach((d,i)=>{if(!d.value)return;const f=d.value/tot,a1=a0+f*2*Math.PI,c=COL[i%COL.length],tip=`${d.label} : ${unit(d.value)} (${Math.round(f*100)} %)`;
    if(f>=.9999)svg.append(s('circle',{cx,cy,r:(R+r)/2,fill:'none',stroke:c,'stroke-width':R-r},s('title',{},tip)));
    else{const P=(a,q)=>[cx+q*Math.cos(a),cy+q*Math.sin(a)],[x0,y0]=P(a0,R),[x1,y1]=P(a1,R),[x2,y2]=P(a1,r),[x3,y3]=P(a0,r),L=f>.5?1:0;
      svg.append(s('path',{d:`M${x0} ${y0}A${R} ${R} 0 ${L} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${L} 0 ${x3} ${y3}Z`,fill:c},s('title',{},tip)))}
    leg.append(h('div',{},h('i',{style:'background:'+c}),h('span',{textContent:d.label}),h('em',{textContent:`${Math.round(f*100)} %`})));a0=a1});
  svg.append(s('text',{x:cx,y:cy+2,class:'ctr'},total),s('text',{x:cx,y:cy+13,class:'ctr2'},'total'));
  return h('div',{className:'pie'},svg,leg)}

/* ---- Histogramme (colonnes) ---- */
function bars(data,step,unit){
  const max=Math.max(0,...data.map(d=>d.value));if(!max)return empty();
  const W=320,H=170,L=34,B=20,T=8,top=max*1.1,pw=W-L-4,ph=H-B-T,bw=pw/data.length,svg=s('svg',{viewBox:`0 0 ${W} ${H}`,class:'bars'});
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;svg.append(s('line',{x1:L,x2:W-2,y1:y,y2:y,class:'gl'}),s('text',{x:L-4,y:y+3,class:'ax','text-anchor':'end'},cf(top*i/4)))}
  data.forEach((d,i)=>{const x=L+i*bw,hh=ph*d.value/top;
    svg.append(s('rect',{x:x+bw*.12,y:T+ph-hh,width:Math.max(bw*.76,1),height:hh,rx:1.5,fill:d.hi?'#ff7d01':'#3f78d8'},s('title',{},`${d.label} : ${unit(d.value)}`)));
    if(i%step===0)svg.append(s('text',{x:x+bw/2,y:H-6,class:'ax','text-anchor':'middle'},d.label))});
  return svg}

/* ---- Barres horizontales (articles) ---- */
function hbars(items){
  if(!items.length)return empty();const max=Math.max(...items.map(i=>i.rev),1),box=h('div');
  items.forEach(i=>box.append(h('div',{className:'hb'},h('span',{textContent:i.name}),h('div',{className:'t'},h('i',{style:`width:${Math.max(i.rev/max*100,2)}%`})),h('span',{textContent:`${cf(i.rev)} · ${nb(i.qty)} u.`}))));return box}

const card=(t,...k)=>h('div',{className:'card'},h('h2',{textContent:t}),...k);
function render(d){
  const k=d.kpi,cnt=k.cnt||0,out=$('out'),tot=nb(k.n);
  const kp=(l,v,sub)=>h('div',{className:'card kpi'},h('small',{textContent:l}),h('b',{textContent:v}),h('span',{textContent:sub||'\u00a0'}));
  const rate=k.n?Math.round(k.voids/k.n*1000)/10:0;
  /* jours de la période (heure du Cameroun, UTC+1), jours sans vente = 0 */
  const m=Object.fromEntries(d.byDay.map(x=>[x.day,x.rev])),days=[];
  for(let t=d.period.from;t<=d.period.to;t+=864e5){const dk=new Date(t+36e5).toISOString().slice(0,10);if(!days.length||days[days.length-1].k!==dk)days.push({k:dk,label:dk.slice(8)+'/'+dk.slice(5,7),value:m[dk]||0})}
  const hrs=Object.fromEntries(d.byHour.map(x=>[x.hour,x.cnt])),BIN=['< 1 k','1–2 k','2–5 k','5–10 k','10–20 k','20–50 k','> 50 k'],am=Object.fromEntries(d.amounts.map(x=>[x.bin,x.n]));
  const perf=h('div',{className:'perf'},h('div',{className:'row h'},...['Employé','CA','Reçus','Panier moy.','Annulés','Signalés'].map(t=>h('span',{textContent:t}))));
  d.byEmployee.forEach(e=>{const tn=(e.cnt||0)+(e.voids||0),rt=tn?e.voids/tn:0,hi=tn>=3&&rt>Math.max(.1,2*(k.n?k.voids/k.n:0));
    perf.append(h('div',{className:'row'},h('b',{textContent:e.name+(e.role==='owner'?' (vous)':'')}),h('span',{textContent:cf(e.rev||0)}),h('span',{textContent:nb(e.cnt)}),h('span',{textContent:e.cnt?cf(e.rev/e.cnt):'-'}),
      h('span',{className:hi?'warn':'',textContent:`${e.voids||0}${tn?` (${Math.round(rt*100)} %)`:''}`}),h('span',{textContent:nb(e.flags)})))});
  out.replaceChildren(
    h('div',{className:'kpis'},kp('Chiffre d’affaires',fmt(k.rev),'hors reçus annulés'),kp('Reçus',nb(cnt),`${tot} émis au total`),kp('Panier moyen',cnt?fmt(k.rev/cnt):'-'),kp('Annulations',`${nb(k.voids)} (${rate} %)`,`${nb(k.flagged)} signalé(s) en attente`)),
    h('div',{className:'grid'},
      card('Chiffre d’affaires par boutique',donut(d.byShop.map(x=>({label:x.name,value:x.rev||0})),cf(k.rev),fmt)),
      card('Chiffre d’affaires par employé',donut(d.byEmployee.map(x=>({label:x.name,value:x.rev||0})),cf(k.rev),fmt)),
      card('Modes de paiement',donut(d.byMethod.map(x=>({label:ML[x.method]||x.method,value:x.rev||0})),cf(k.rev),fmt)),
      card('Statut des reçus',donut(['valid','flagged','void'].map(st=>({label:SL[st],value:(d.byState.find(x=>x.state===st)||{}).n||0})),tot,v=>nb(v)+' reçu(s)'))),
    h('div',{className:'grid'},
      card('Ventes par jour',bars(days,Math.ceil(days.length/6),fmt)),
      card('Reçus par heure de la journée',bars(Array.from({length:24},(_,i)=>({label:i+'h',value:hrs[i]||0})),3,v=>nb(v)+' reçu(s)')),
      card('Répartition des montants de reçus (FCFA)',bars(BIN.map((l,i)=>({label:l,value:am[i]||0})),1,v=>nb(v)+' reçu(s)')),
      card('Articles les plus vendus',hbars(d.topItems))),
    card('Performance des employés',d.byEmployee.length?perf:empty(),h('p',{className:'note',textContent:'Ces indicateurs aident à repérer ce qui mérite un examen : un taux d’annulation élevé n’est pas une preuve de fraude. Il est mis en évidence quand il dépasse nettement la moyenne de l’entreprise.'})))}

async function load(){
  const v=$('per').value,now=new Date(),to=Date.now();
  const from=v==='month'?Date.UTC(now.getFullYear(),now.getMonth(),1)-36e5:v==='year'?Date.UTC(now.getFullYear(),0,1)-36e5:to-(+v)*864e5;
  try{render(await api(`stats?from=${from}&to=${to}&shop=${$('shp').value}&user=${$('usr').value}`))}catch(e){$('out').replaceChildren(h('p',{className:'empty',textContent:e&&e.error==='forbidden'?'Réservé au propriétaire.':'Impossible de charger les statistiques. Reconnectez-vous dans l’espace entreprise.'}))}}
(async()=>{try{
  const me=await api('me');if(me.user.role!=='owner'){$('out').replaceChildren(h('p',{className:'empty',textContent:'Réservé au propriétaire.'}));return}
  me.shops.forEach(x=>$('shp').append(h('option',{value:x.id,textContent:x.name})));
  (await api('employees')).forEach(x=>$('usr').append(h('option',{value:x.id,textContent:x.name})));
  ['per','shp','usr'].forEach(i=>$(i).addEventListener('change',load));load()
}catch(e){location.href='espace.html'}})();
</script>
</body>
</html>
