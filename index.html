<script>
const ICON='data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20rx%3D%2240%22%20fill%3D%22%23072652%22%2F%3E%3Crect%20x%3D%2256%22%20y%3D%2224%22%20width%3D%2270%22%20height%3D%22124%22%20rx%3D%2213%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%227%22%2F%3E%3Crect%20x%3D%2274%22%20y%3D%2238%22%20width%3D%2232%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%23ffffff%22%2F%3E%3Cpath%20d%3D%22M64%2092%20L86%20112%20L124%2060%22%20stroke%3D%22%23ff7d01%22%20stroke-width%3D%2214%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Crect%20x%3D%2290%22%20y%3D%22100%22%20width%3D%2254%22%20height%3D%2252%22%20rx%3D%227%22%20fill%3D%22%23ffffff%22%2F%3E%3Crect%20x%3D%22100%22%20y%3D%22114%22%20width%3D%2228%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%23072652%22%2F%3E%3Crect%20x%3D%22100%22%20y%3D%22124%22%20width%3D%2228%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%23072652%22%2F%3E%3Crect%20x%3D%22100%22%20y%3D%22134%22%20width%3D%2218%22%20height%3D%224%22%20rx%3D%222%22%20fill%3D%22%23072652%22%2F%3E%3C%2Fsvg%3E';

  const d=m(/(\d{4})-(\d{2})-(\d{2})[ T]+(\d{1,2}:\d{2})/);if(d){const dd=new Date(`${d[1]}-${d[2]}-${d[3]}T${d[4].padStart(5,'0')}:00`);if(!isNaN(dd))o.date=dd.toISOString()}

  const c=m(/\bde\s+\d{8,12}\s+((?:[A-ZÀ-Ý][A-Za-zÀ-ÿ'’-]+\s+){1,4}?)vers\b/)||m(/\bau\s+((?:[A-ZÀ-Ý][A-Za-zÀ-ÿ'’-]+\s+){1,3}[A-ZÀ-Ý][A-Za-zÀ-ÿ'’-]+)/)||m(/(?:de la part de|par)\s+([A-Za-zÀ-ÿ]+(?:\s+[A-Za-zÀ-ÿ]+){1,3})/);
  if(c)o.client=c[1].replace(/\s+/g,' ').trim();return o}
async function getBmp(f){try{return await createImageBitmap(f)}catch(e){const i=await new Promise((ok,ko)=>{const m=new Image();m.onload=()=>ok(m);m.onerror=ko;m.src=URL.createObjectURL(f)});const c=h('canvas',{width:i.naturalWidth,height:i.naturalHeight});c.getContext('2d').drawImage(i,0,0);return c}}
async function prep(f,deg){const b=await getBmp(f),r=deg%180!==0,k=Math.min(2,1500/Math.max(b.width,b.height)),w=Math.round(b.width*k),hh=Math.round(b.height*k),
  c=h('canvas',{width:r?hh:w,height:r?w:hh}),x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(deg*Math.PI/180);x.drawImage(b,-w/2,-hh/2,w,hh);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){const g=Math.max(0,Math.min(255,(.299*p[i]+.587*p[i+1]+.114*p[i+2]-120)*1.5+120));p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0);return c}
async function readSms(f,say){if(typeof Tesseract==='undefined')throw new Error('module de lecture non chargé');say('⏳ Lecture de la photo…');let wk,best={txt:'',sc:-1};
  try{const run=async()=>{wk=await Tesseract.createWorker('fra+eng',1,{logger:m=>{if(m.progress!=null)say('⏳ Lecture de la photo… '+Math.round(m.progress*100)+'%')}});
    for(const deg of [0,90,270,180]){const r=await wk.recognize(await prep(f,deg)),txt=r.data.text||'',sc=r.data.confidence+(/XAF|FCFA|d[ée]p[ôo]t|transaction|montant|retrait|transfert/i.test(txt)?40:0);if(sc>best.sc)best={txt,sc};if(sc>=100)break}};
    await Promise.race([run(),new Promise((_,ko)=>setTimeout(()=>ko(new Error('délai dépassé')),120000))])}
  finally{if(wk)wk.terminate()}return best.txt}

async function exportCsv(){const {data,error}=await sb.from('receipts').select('*').eq('shop_id',S.shop.id).order('created_at',{ascending:false}).limit(5000);if(error)return toast(err(error),'err');
  if(data.length>=5000)toast('Export limité aux 5000 reçus les plus récents');   // ne jamais tronquer en silence
  data.reverse();   // ordre chronologique dans le fichier
  // Sécurité : les champs = + - @ (et tabulations/retours) en début de cellule seraient interprétés comme des formules par Excel/LibreOffice → préfixer d'une apostrophe
  const q=v=>{let s=String(v??'');if(/^[\t\r\n ]*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'},L=[['N°','Date','Client','Mode','TxID','Statut','Total (FCFA)','Annulé','Créé par'].map(q).join(';')];
  data.forEach(r=>L.push([pad(r.number),dt(r.paid_at||r.created_at),r.customer_name,M[r.method],r.tx_id,ST[r.pay_status],r.total,r.canceled_at?'oui':'',S.names[r.created_by]||''].map(q).join(';')));
  saveAs(new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}),('recus-'+S.shop.name+'.csv').replace(/\s+/g,'_'))}
function logoUp(f){if(!f)return;const i=new Image();i.onload=async()=>{const k=Math.min(1,160/Math.max(i.width,i.height)),c=h('canvas',{width:Math.round(i.width*k),height:Math.round(i.height*k)});
  c.getContext('2d').drawImage(i,0,0,c.width,c.height);const u=c.toDataURL('image/png'),r=await sb.from('shops').update({logo_url:u}).eq('id',S.shop.id);
  if(r.error)return toast(err(r.error),'err');S.shop.logo_url=u;toast('Logo enregistré ✔','ok')};i.src=URL.createObjectURL(f)}
async function journal(){const {data,error}=await sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(60);if(error)return toast(err(error),'err');
  const A={'receipt.create':'a créé le reçu','receipt.cancel':'a annulé un reçu','permissions.set':'a modifié les droits de','permissions.remove':'a retiré l’accès à la boutique de','staff.create':'a créé le compte de','staff.disable':'a désactivé le compte de','staff.enable':'a réactivé le compte de','staff.password':'a changé le mot de passe de'};
  openSheet('Journal d’activité',h('div',{},h('p',{className:'sub',textContent:'60 derniers événements'}),...(data.length?data.map(l=>{const d=l.details||{};
    let extra='';if(l.action==='receipt.create'&&d.number!=null)extra=' '+pad(d.number);
    else if(l.action==='receipt.cancel'&&d.reason)extra=' ('+d.reason+')';
    else if(String(l.action).startsWith('staff.')||l.action==='permissions.set'||l.action==='permissions.remove')extra=' '+(S.mn[l.entity_id]||'');
    return h('div',{style:'display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)'},
    h('span',{style:'font-size:.85rem',textContent:`${S.names[l.user_id]||'?'} ${A[l.action]||l.action}`+extra}),
    h('small',{className:'sub',textContent:dt(l.created_at)}))}):[empty('📋','Aucune activité','')])))}
