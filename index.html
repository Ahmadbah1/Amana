<style>

.stamp{text-align:center;font-weight:700;font-size:.8rem}.stamp.ok{color:#2e7d32}.stamp.pend{color:#e65100}.stamp.chk{color:#c62828}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

const PW_MIN = 12;
const pwScore = p => { let s = 0; const v = p || '';
  if (v.length >= PW_MIN) s++;
  if (/[a-z]/.test(v)) s++;
  if (/[A-Z]/.test(v)) s++;
  if (/\d/.test(v)) s++;
  if (/[^a-zA-Z0-9]/.test(v)) s++;
  return s };

const pwOk = p => { const v = p || ''; const w = v.trim().toLowerCase();
  return v.length >= PW_MIN && /[a-z]/.test(v) && /[A-Z]/.test(v) && /\d/.test(v) && !COMMON_PASSWORDS.has(w) };
// Politique allégée pour les employés (création + changement gérant) : 8 caractères min + casse + chiffre,
// sans dictionnaire — l'employé est limité au niveau des actions par la matrice de droits.
// La politique stricte (12+/min/maj/chiffre/dictionnaire) s'applique au gérant et au changement self-service.
const EMP_MIN = 8;
const empOk = p => { const v = p || '';
  return v.length >= EMP_MIN && /[a-z]/.test(v) && /[A-Z]/.test(v) && /\d/.test(v) };
const attachPwHint = (inp, hint, mode) => { const upd = () => { const v = inp.value, s = pwScore(v), [lbl, col] = pwLabel(s);
  const ok = mode === 'emp' ? empOk(v) : pwOk(v);
  const def = mode === 'emp' ? '8 caractères minimum · minuscule · majuscule · chiffre' : '12 caractères minimum · minuscule · majuscule · chiffre · sans mot de passe commun';
  hint.textContent = v ? (ok ? '✔ Conforme — ' + lbl : '⚠ Insuffisant — ' + lbl + ', réessayez') : def;
  hint.style.color = v ? col : 'var(--mut)' }; inp.addEventListener('input', upd); upd() };

// Normalise un numéro de téléphone camerounais au format E.164 (+2376XXXXXXXX)
// Accepte : 6XXXXXXXX, 2376XXXXXXXX, +2376XXXXXXXX, +237 6XX XX XX XX, 6XX XX XX XX
const normalizePh = v => { let n = String(v ?? '').replace(/\s|[-./]/g,''); if (!n.startsWith('+')) n = '+' + (n.startsWith('237') ? n.slice(3) : '237' + n); return n };

  else{const u=inp('Identifiant'),p=inp('Mot de passe','password');f=[u,p];

async function boot(){const {data:{session}}=await sb.auth.getSession();
  if(session&&S.user&&S.user.id===session.user.id&&!$('app').hidden)return;   // évite de tout recharger quand l'onglet reprend le focus
  ['auth','onb','app'].forEach(i=>$(i).hidden=true);
  if(!session){S.user=null;if(sub){sb.removeChannel(sub);sub=null}authView();$('auth').hidden=false;return endSplash()}
  S.user=session.user;
  const {data:ms,error:me}=await sb.from('members').select('id,org_id,role,display_name,active').eq('user_id',S.user.id);
  if(me)return netFail(me);   // erreur réseau/serveur : afficher « Réessayer », pas l'onboarding
  S.me=ms&&ms[0];
  if(!S.me){onbView();$('onb').hidden=false;return endSplash()}
  if(!S.me.active){toast('Compte désactivé par le gérant','err');return sb.auth.signOut()}
  await loadAll();shell();$('app').hidden=false;go(S.tab);endSplash()}
const endSplash=()=>{const s=$('splash');s.style.opacity=0;setTimeout(()=>s.hidden=true,400)};
async function loadAll(){
  const [sh,mp,og]=await Promise.all([sb.from('shops').select('*').order('created_at'),sb.from('member_shops').select('shop_id,permissions').eq('member_id',S.me.id),sb.from('organizations').select('name,plan').maybeSingle()]);
  S.shops=sh.data||[];S.perms=Object.fromEntries((mp.data||[]).map(x=>[x.shop_id,x.permissions]));S.org=og.data||{};
  S.shop=S.shops.find(s=>s.id===ls('shop'))||S.shops[0];
  if(S.me.role==='owner'){const {data}=await sb.from('members').select('id,user_id,display_name');S.names=Object.fromEntries((data||[]).map(m=>[m.user_id,m.display_name]));S.mn=Object.fromEntries((data||[]).map(m=>[m.id,m.display_name]))}
  await loadRecs();await subscribe()}
// Abonnement filtré sur la boutique courante : on ne reçoit pas les changements des autres boutiques/orgs.
// À noter : la RLS ne s'applique au temps réel Supabase que si Realtime Authorization est activé ;
// sinon, les images de lignes peuvent être diffusées indépendamment de la RLS — le filtre limite ce risque
// et la recharge toutes les 30 s (setInterval en bas de page) reste le filet de sécurité. Voir schema.sql.
function updateRtWarn(){const w=$('rtWarn');if(!w)return;w.hidden=!!S.rtEnabled}

  if(S.tab==='receipts'&&!$('app').hidden)(document.activeElement&&document.activeElement.classList.contains('srch')?recsList:recsView)()}

function recsList(){const l=$('list');if(!l)return;
  const rs=S.recs.filter(r=>{
    if(S.filter==='today'&&!sameDay(r.created_at))return false;
    if(S.filter==='canceled'&&!r.canceled_at)return false;

    else if(S.statusFilter!=='all'){if(r.canceled_at||r.pay_status!==S.statusFilter)return false}

const esc=(x)=>String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const anKpi=(label,val,sub,cls='')=>h('div',{className:'an-kpi '+cls},h('span',{textContent:label}),h('b',{textContent:val}),sub?h('small',{textContent:sub}):null);
const curveSvg=(points)=>{
  const W=340,H=150,padX=8,top=12,bot=20;
  const maxV=Math.max(...points.map(p=>p.value),1);
  const n=points.length;
  const px=i=>padX+(i*(W-2*padX))/Math.max(1,n-1);
  const py=v=>top+(H-top-bot)*(1-v/maxV);
  let line='';points.forEach((p,i)=>{line+=(i===0?'M':'L')+px(i).toFixed(1)+','+py(p.value).toFixed(1)});
  const area=line+'L'+px(n-1).toFixed(1)+','+(H-bot)+'L'+px(0).toFixed(1)+','+(H-bot)+'Z';
  let ticks='';points.forEach((p,i)=>{if(i%5===0)ticks+='<text x="'+px(i).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle" class="ca-tick">'+esc(p.label.slice(0,5))+'</text>'});
  const last=points[n-1],lx=px(n-1),ly=py(last.value);
  return '<svg viewBox="0 0 '+W+' '+H+'" class="an-svg" role="img" aria-label="Courbe du chiffre d’affaires">'
    +'<path d="'+area+'" class="ca-area"/><path d="'+line+'" class="ca-line"/>'
    +'<line x1="'+padX+'" x2="'+(W-padX)+'" y1="'+(H-bot)+'" y2="'+(H-bot)+'" class="ca-base"/>'
    +'<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="3.5" class="ca-dot"/>'+ticks+'</svg>'};
const donutSvg=(segments,centerText,size=112)=>{
  const total=segments.reduce((a,x)=>a+(+x.value||0),0)||1;
  const R=36,C=2*Math.PI*R;let off=0;
  const parts=segments.filter(x=>(+x.value||0)>0).map(x=>{
    const len=((+x.value||0)/total)*C;
    const c='<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+x.color+'" stroke-width="15" stroke-dasharray="'+Math.max(0.1,len-1.4).toFixed(2)+' '+C.toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';
    off+=len;return c}).join('');
  return '<svg viewBox="0 0 100 100" class="an-svg" style="width:'+size+'px;height:'+size+'px;flex:none" role="img"><g transform="rotate(-90 50 50)">'+parts+'</g><circle cx="50" cy="50" r="26" fill="var(--card)"/><text x="50" y="50" text-anchor="middle" dominant-baseline="central" class="an-donut-center" font-size="13">'+esc(centerText||'')+'</text></svg>'};
const hbars=(node,rows)=>{
  const max=Math.max(...rows.map(r=>+r.value||0),1);
  node.replaceChildren(...rows.map(r=>{
    const pct=Math.max(2,Math.round(((+r.value||0)/max)*100));

      h('span',{className:'an-track'},h('span',{className:'an-fill',style:'width:'+pct+'%;background:'+(r.color||'var(--acc)')})),
      h('span',{className:'an-val'},h('b',{textContent:r.sub||String(r.value)}),r.extra?h('small',{textContent:r.extra}):null))}));
};

const b64uEnc = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64uDec = (str) => { const s = str.replace(/-/g,'+').replace(/_/g,'/'); const padded = s + '='.repeat((4 - (s.length % 4)) % 4); return Uint8Array.from(atob(padded), c => c.charCodeAt(0)); };
const strToBytes = (str) => Uint8Array.from(str, c => c.charCodeAt(0));

async function webauthnHasCredential(){
  const {data:{session}}=await sb.auth.getSession();
  const rr=await fetch(SUPABASE_URL+'/functions/v1/webauthn',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:SUPABASE_ANON},body:JSON.stringify({action:'authenticate/start'})}),r=await rr.json();
  return !r.error && !!r.challenge;
}

async function webauthnRegister(){
  const {data:{session}}=await sb.auth.getSession();
  const rr=await fetch(SUPABASE_URL+'/functions/v1/webauthn',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:SUPABASE_ANON},body:JSON.stringify({action:'register/start'})}),r=await rr.json();
  if (r.error) return toast(err(r.error), 'err');
  const cred = await navigator.credentials.create({
    publicKey: {
      challenge: b64uDec(r.challenge),
      rp: { name: 'Amana', id: window.location.hostname },
      user: { id: strToBytes(userIdForWebauthn()), name: r.user.name, displayName: r.user.name },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
      timeout: 60000,
      attestation: 'direct',
    },
  });
  if (!cred) return toast('Échec de l\'enregistrement de l\'empreinte', 'err');
  const att = cred.response;
  const rr2=await fetch(SUPABASE_URL+'/functions/v1/webauthn',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:SUPABASE_ANON},body:JSON.stringify({action:'register/finish',
    attestation_object: b64uEnc(new Uint8Array(att.attestationObject)),
    client_data_json: b64uEnc(new Uint8Array(att.clientDataJSON)),
    challenge: r.challenge,
  })}),j2=await rr2.json();if(j2.error)return toast(err(j2.error),'err');
  toast('Empreinte enregistrée ✔','ok');
  setView();
}

async function webauthnAuthenticate(){
  const {data:{session}}=await sb.auth.getSession();
  const rr3=await fetch(SUPABASE_URL+'/functions/v1/webauthn',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:SUPABASE_ANON},body:JSON.stringify({action:'authenticate/start'})}),r3=await rr3.json();
  if (r.error) return toast(err(r.error), 'err');
  const assertion = await navigator.credentials.get({
    publicKey: {
      challenge: b64uDec(r.challenge),
      allowCredentials: [],
      userVerification: 'required',
      timeout: 60000,
    },
  });
  if (!assertion) return toast('Échec de l\'authentification par empreinte', 'err');
  const resp = assertion.response;
  const rr4=await fetch(SUPABASE_URL+'/functions/v1/webauthn',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token,apikey:SUPABASE_ANON},body:JSON.stringify({action:'authenticate/finish',
    credential_id: b64uEnc(assertion.rawId),
    signature: b64uEnc(new Uint8Array(resp.signature)),
    authenticator_data: b64uEnc(new Uint8Array(resp.authenticatorData)),
    client_data_json: b64uEnc(new Uint8Array(resp.clientDataJSON)),
    challenge: r.challenge,
  })}),j4=await rr4.json();if(j4.error)return toast(err(j4.error),'err');
  toast('Connexion par empreinte ✔','ok');
}

function parseSms(x){const o={},m=r=>x.match(r);
  if(/orange/i.test(x))o.method='om';else if(/mobile\s*money|momo|mtn/i.test(x))o.method='mtn';
  const a=m(/(?:d[ée]p[ôo]t|retrait|montant|pay[ée]|re[çc]u|envoy[ée]|transf[ée]r[ée])\D{0,15}?(\d[\d\s.,]*)\s*(?:FCFA|XAF|F\b)/i)||m(/(\d[\d\s.,]*)\s*(?:FCFA|XAF)/i);
  if(a){const c=a[1].trim().replace(/[.,]\d{1,2}$/,'').replace(/\D/g,'');if(c)o.amount=+c}
  const d=m(/(\d{4})-(\d{2})-(\d{2})[ T]+(\d{1,2}:\d{2})/);if(d){const dd=new Date(`${d[1]}-${d[2]}-${d[3]}T${d[4].padStart(5,'0')}:00`);if(!isNaN(dd))o.date=dd.toISOString()}
  const tx=m(/\b(?:Trans(?:action)?\s*(?:ID|Id)?|TxId|R[ée]f(?:[ée]rence)?|ID)\b\s*[:.]?\s*((?=[A-Za-z.]*\d)[A-Za-z0-9.]{6,})/i);if(tx)o.tx=tx[1].replace(/\.+$/,'');
  const c=m(/\bde\s+\d{8,12}\s+((?:[A-ZÀ-Ý][A-Za-zÀ-ÿ'’-]+\s+){1,4}?)vers\b/)||m(/\bau\s+((?:[A-ZÀ-Ý][A-Za-zÀ-ÿ'’-]+\s+){1,3}[A-ZÀ-Ý][A-Za-zÀ-ÿ'’-]+)/)||m(/(?:de la part de|par)\s+([A-Za-zÀ-ÿ]+(?:\s+[A-Za-zÀ-ÿ]+){1,3})/);
  if(c)o.client=c[1].replace(/\s+/g,' ').trim();return o}
async function getBmp(f){try{return await createImageBitmap(f)}catch(e){const i=await new Promise((ok,ko)=>{const m=new Image();m.onload=()=>ok(m);m.onerror=ko;m.src=URL.createObjectURL(f)});const c=h('canvas',{width:i.naturalWidth,height:i.naturalHeight});c.getContext('2d').drawImage(i,0,0);return c}}
async function prep(f,deg){const b=await getBmp(f),r=deg%180!==0,k=Math.min(2,1500/Math.max(b.width,b.height)),w=Math.round(b.width*k),hh=Math.round(b.height*k),
  c=h('canvas',{width:r?hh:w,height:r?w:hh}),x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(deg*Math.PI/180);x.drawImage(b,-w/2,-hh/2,w,hh);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){const g=Math.max(0,Math.min(255,(.299*p[i]+.587*p[i+1]+.114*p[i+2]-120)*1.5+120));p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0);return c}
async function readSms(f,say){if(typeof Tesseract==='undefined')throw new Error('module de lecture non chargé');say(0);let wk,best={txt:'',sc:-1};
  try{const run=async()=>{wk=await Tesseract.createWorker('fra+eng',1,{logger:m=>{if(m.progress!=null)say(m.progress)}});
    for(const deg of [0,90,270,180]){const r=await wk.recognize(await prep(f,deg)),txt=r.data.text||'',sc=r.data.confidence+(/XAF|FCFA|d[ée]p[ôo]t|transaction|montant|retrait|transfert/i.test(txt)?40:0);if(sc>best.sc)best={txt,sc};if(sc>=100)break}};
    await Promise.race([run(),new Promise((_,ko)=>setTimeout(()=>ko(new Error('délai dépassé')),120000))])}
  finally{if(wk)wk.terminate()}return best.txt}

// PWA install prompt (Android/Chrome) : propose d'installer l'app comme une appli native
let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;try{$('installBtn').hidden=false}catch(_){}});
async function installPwa(){if(!installPrompt)return toast('Installation non disponible sur cet appareil','err');installPrompt.prompt();const r=await installPrompt.userChoice;if(r.outcome==='accepted')toast('Amana installé ✔','ok');installPrompt=null;try{$('installBtn').hidden=true}catch(_){}};

// Service Worker (PWA installable) : se met à jour en arrière-plan ; jamais bloquant
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js').catch(()=>{})})}
</script>
<div id="installBtn" hidden><button class="btn g" onclick="installPwa()">⬇ Installer Amana</button></div>
</body></html>
